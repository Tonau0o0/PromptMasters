[project]
name = "promptmasters"
version = "0.1.0"
description = "Neuro-Agent — Dinamik Bilgi Grafiği için backend ve dosya işleme servisi."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "python-multipart==0.0.9",
    "pydantic>=2.7,<3",
    "pandas==2.2.2",
    "openpyxl==3.1.3",
    "pypdf==4.2.0",
    "python-docx==1.1.2",
    "langchain==0.2.6",
    "langchain-community==0.2.6",
    "langchain-text-splitters==0.2.2",
    "chromadb==0.5.3",
    "sentence-transformers==3.0.1",
    "google-genai>=0.8,<2",
    "python-dotenv>=1.0",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
]

[tool.uv]
# Repo bir Python paketi olarak kurulmaz; sadece bağımlılıkları yönetir.
package = false

[tool.uv.sources]
# (Boş — gelecekte git/path bağımlılıkları için)
