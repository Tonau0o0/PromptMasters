appId: com.neuroagent.app
productName: Neuro-Agent
copyright: "Copyright © 2025 PromptMasters"

directories:
  output: dist-electron
  buildResources: build-assets

files:
  - electron/**/*
  - out/**/*          # Next.js static export
  - node_modules/**/*
  - package.json

extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*.py"
      - "requirements.txt"
      - "!**/__pycache__/**"
      - "!**/*.pyc"

win:
  target:
    - nsis
  icon: build-assets/icon.ico

mac:
  target:
    - dmg
  icon: build-assets/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  icon: build-assets/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - tr_TR
    - en_US
