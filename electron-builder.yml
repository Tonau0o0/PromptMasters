appId: com.neuroagent.app
productName: Neuro-Agent
copyright: "Copyright © 2025 PromptMasters"

directories:
  output: dist-electron
  buildResources: build-assets

files:
  - electron/**/*
  - out/**/*          # Next.js static export
  - node_modules/**/*
  - package.json

extraResources:
  # PyInstaller ile üretilmiş standalone backend bundle'ı.
  # `npm run backend:build` çıktısı: dist-backend/neuro-backend/{neuro-backend(.exe), _internal/...}
  - from: dist-backend/neuro-backend
    to: backend-bin

win:
  target:
    - nsis
  icon: build-assets/icon.ico

mac:
  target:
    - dmg
  icon: build-assets/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  icon: build-assets/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - tr_TR
    - en_US
