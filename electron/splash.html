<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>Neuro-Agent</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f5f5f7;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .panel {
      position: absolute;
      inset: 16px;
      border-radius: 20px;
      background: linear-gradient(165deg, #0b0b0f 0%, #070709 70%);
      border: 1px solid rgba(168, 85, 247, 0.25);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.02) inset,
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 60px rgba(168, 85, 247, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .logo {
      position: relative;
      width: 84px;
      height: 84px;
      border-radius: 20px;
      background: linear-gradient(135deg, #a855f7 0%, #22d3ee 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 12px 30px rgba(168, 85, 247, 0.45),
        0 0 60px rgba(34, 211, 238, 0.25);
      animation: pulse 2.6s ease-in-out infinite;
    }
    .logo::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 24px;
      background: radial-gradient(closest-side, rgba(168, 85, 247, 0.45), transparent 70%);
      filter: blur(14px);
      z-index: -1;
    }
    .logo svg {
      width: 40px;
      height: 40px;
      color: white;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #d4d4d8;
    }
    .subtitle {
      font-size: 11px;
      color: #71717a;
      margin-top: -10px;
      letter-spacing: 0.05em;
    }

    .status {
      font-size: 12px;
      color: #a1a1aa;
      margin-top: 6px;
    }

    .dot-flow {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .dot-flow span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a855f7;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.7);
      animation: dotFlow 1.2s ease-in-out infinite;
    }
    .dot-flow span:nth-child(2) { animation-delay: 0.18s; background: #c084fc; }
    .dot-flow span:nth-child(3) { animation-delay: 0.36s; background: #22d3ee; box-shadow: 0 0 10px rgba(34, 211, 238, 0.7); }

    @keyframes dotFlow {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
      40%           { opacity: 1;    transform: scale(1.25); }
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="logo">
      <!-- Brain icon (lucide-style, inlined) -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
        <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
      </svg>
    </div>

    <div>
      <div class="title">Neuro-Agent</div>
    </div>
    <div class="subtitle">Dinamik Bilgi Grafiği</div>

    <div class="status">Beyin hazırlanıyor…</div>
    <div class="dot-flow"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
